blueprint:
  name: Aula inteligente - Puerta, movimiento y horario
  description: >-
    Versión 2.3. Para salones CON sensor de puerta. La puerta manda; el movimiento confirma si hay gente.
    Con horario y Workday:

    - Se abre la puerta: si estaba LIBRE y en automático, enciende (primero el aire y su temperatura,
      luego las luces; a los 20 s reenvía la temperatura si el termostato no la tomó). Si la puerta
      queda abierta el tiempo configurado, apaga primero el aire y después las luces, AUNQUE HAYA
      MOVIMIENTO (la puerta debe permanecer cerrada). Queda en PUERTA_ABIERTA hasta que la cierren, y
      el aire solo vuelve cuando se confirma que hay gente.

    - Se cierra la puerta: SCAN. Hay gente si el movimiento se activa durante el scan, si sigue activo
      al terminarlo o si alguien manipula un interruptor o un termostato. Con gente: OCUPADO (y si el
      aire estaba apagado por la puerta, se reanuda). Sin gente: el aire se APAGA o se SUBE (según "Al
      quedar libre"), el salón pasa a LIBRE y después se apagan las luces.

    - Movimiento estando LIBRE con la puerta cerrada (la puerta no registró la entrada): en
      automático enciende y confirma con el scan.

    - Protección: OCUPADO sin ningún movimiento durante el tiempo máximo → apaga (0 = desactivada).

    - Hora de inicio (día hábil según Workday): pasa a AUTOMÁTICO. Hora de fin: pasa a MANUAL y
      apaga si el salón está vacío. En MANUAL nunca enciende, solo apaga. Con un calendario de horas
      operativas, el inicio y el fin son los de cada evento del calendario en lugar de horas fijas.

    - LIBRE elegido por una persona o una escena (p. ej. la escena nocturna): apaga todo.

    - Al reiniciar Home Assistant no confía en el estado guardado: con la puerta abierta corre la
      cuenta de puerta abierta; con la puerta cerrada y movimiento o equipos encendidos hace un SCAN;
      sin nada, queda LIBRE.

    El Tiempo de Scan debe ser MAYOR que el tiempo que el sensor de movimiento se queda encendido.

    Usa los ayudantes y estados (LIBRE, OCUPADO, PUERTA_ABIERTA, SCAN) de "Aula inteligente - Multi dispositivos".
  domain: automation
  author: NovaEnergyCo
  source_url: https://github.com/NovaEnergyCo/home-assistant-blueprints/blob/main/aula-puerta-movimiento-horario/aula_puerta_horario.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    door_sensor:
      name: Sensor de puerta
      selector:
        entity:
          domain: binary_sensor
          device_class: door

    motion_sensors:
      name: Sensores de Movimiento
      description: "binary_sensor o switch. Encendido = hay movimiento."
      selector:
        entity:
          domain:
            - binary_sensor
            - switch
          multiple: true

    modo_auto:
      name: Modo Automático
      description: "input_boolean. El horario lo enciende y lo apaga. ON = enciende y apaga; OFF = solo apaga."
      selector:
        entity:
          domain: input_boolean

    target_lights:
      name: Iluminación (Opcional)
      description: "Luces que se encienden con el salón y se apagan cuando queda libre."
      default: {}
      selector:
        target:
          entity:
            domain:
              - light
              - switch

    extra_off:
      name: Apagar también al quedar libre (Opcional)
      description: >-
        Luces o cargas que NO se encienden con el salón, pero se apagan junto con las luces:
        al quedar libre, al vencerse la puerta abierta, a la hora de fin y con LIBRE manual.
      default: {}
      selector:
        target:
          entity:
            domain:
              - light
              - switch

    target_climates:
      name: Termostatos (Opcional)
      default: {}
      selector:
        target:
          entity:
            domain: climate

    ac_contactors:
      name: Aire por contactor (Opcional)
      description: "switch del control de carga (CC) que acciona el contactor del aire. Solo enciende o apaga."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    manual_watch:
      name: Actuadores que indican presencia (Opcional)
      description: >-
        Si durante el SCAN alguien prende o apaga uno de estos interruptores, o cambia el modo o la
        temperatura de uno de estos termostatos, el salón pasa a OCUPADO de inmediato. Normalmente:
        los canales de luz del salón, el botón AC y el termostato. Se ignoran los cambios que hacen
        las automatizaciones y scripts.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - switch
                - light
                - climate
                - input_boolean

    classroom_status:
      name: Estado del Aula (Helper)
      description: "input_select con las opciones LIBRE, OCUPADO, PUERTA_ABIERTA, SCAN."
      selector:
        entity:
          domain: input_select

    workday:
      name: Sensor Workday (Opcional)
      description: "Si se indica, el horario solo pasa a automático en días hábiles. Vacío = todos los días."
      default: ""
      selector:
        entity:
          domain: binary_sensor

    operating_calendar:
      name: Calendario de horas operativas (Opcional)
      description: >-
        Si se indica, el horario lo marca este calendario: al empezar un evento pasa a AUTOMÁTICO
        (si el Workday dice que es día hábil) y al terminar pasa a MANUAL. Las horas de inicio y fin
        de abajo se ignoran. Vacío = se usan las horas fijas.
      default: ""
      selector:
        entity:
          domain: calendar

    start_time:
      name: Hora de inicio
      description: "Se ignora si hay calendario de horas operativas."
      default: "06:00:00"
      selector:
        time: {}

    end_time:
      name: Hora de fin
      description: "Se ignora si hay calendario de horas operativas."
      default: "14:00:00"
      selector:
        time: {}

    modo_libre:
      name: Al quedar libre (dentro del horario)
      description: "Fuera del horario siempre se apaga. Con la puerta abierta el aire siempre se apaga."
      default: apagar
      selector:
        select:
          options:
            - label: Apagar el aire
              value: apagar
            - label: Subir a la temperatura de no ocupación
              value: subir

    target_temperature:
      name: Temperatura de ocupación
      default: 23
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    temp_empty:
      name: Temperatura de no ocupación
      description: "Solo con 'Subir a la temperatura de no ocupación'."
      default: 27
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    off_delay:
      name: Tiempo de Scan
      description: >-
        Segundos que se observa el movimiento tras cerrar la puerta (o para confirmar una entrada).
        Debe ser mayor que el tiempo que el sensor de movimiento se queda encendido.
      default: 420
      selector:
        number:
          min: 30
          max: 1800
          unit_of_measurement: seconds
          mode: slider
          step: 30

    door_off_delay:
      name: Tiempo con la puerta abierta
      description: "Si la puerta queda abierta este tiempo, se apaga el aire (y luego las luces), haya o no movimiento."
      default: 300
      selector:
        number:
          min: 30
          max: 1800
          unit_of_measurement: seconds
          mode: slider
          step: 30

    max_sin_movimiento:
      name: Tiempo máximo ocupado sin movimiento
      description: "Protección por si la puerta no registró una salida. 0 = desactivada."
      default: 60
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
          mode: slider
          step: 5

    delay_off_device:
      name: Espera entre el aire y las luces al apagar
      default: 60
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
          mode: slider

    countdown_indicator:
      name: Indicador de Cuenta Regresiva (Opcional)
      default: ""
      selector:
        entity:
          domain: input_number

    previous_status_display:
      name: Visualizador Estado Anterior (Opcional)
      default: ""
      selector:
        entity:
          domain: input_text

# restart: cada disparo aceptado reinicia la lógica (la puerta manda)
mode: restart
max_exceeded: silent

variables:
  motion_sensors_list: !input motion_sensors
  workday_entity: !input workday
  status_entity_top: !input classroom_status
  door_entity: !input door_sensor
  max_sin_movimiento: !input max_sin_movimiento
  calendario: !input operating_calendar
  temp_objetivo: !input target_temperature

# Disponible en las plantillas de los disparadores
trigger_variables:
  cal: !input operating_calendar

triggers:
  - trigger: state
    entity_id: !input door_sensor
    from: "off"
    to: "on"
    id: "puerta_abre"

  - trigger: state
    entity_id: !input door_sensor
    from: "on"
    to: "off"
    id: "puerta_cierra"

  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: "movimiento"

  - trigger: state
    entity_id: !input motion_sensors
    to: "off"
    for:
      minutes: !input max_sin_movimiento
    id: "ocupado_sin_movimiento"

  # Alguien prende/apaga un actuador o cambia el modo del termostato
  - trigger: state
    entity_id: !input manual_watch
    to: null
    id: "manipulacion"

  # Alguien cambia la temperatura del termostato
  - trigger: state
    entity_id: !input manual_watch
    attribute: temperature
    id: "manipulacion"

  - trigger: state
    entity_id: !input classroom_status
    to: "LIBRE"
    id: "libre_manual"

  - trigger: time
    at: !input start_time
    id: "inicio"

  - trigger: time
    at: !input end_time
    id: "fin"

  # Calendario de horas operativas: empieza / termina un evento
  - trigger: template
    value_template: "{{ cal not in ['', none] and is_state(cal, 'on') }}"
    id: "inicio_cal"

  - trigger: template
    value_template: "{{ cal not in ['', none] and is_state(cal, 'off') }}"
    id: "fin_cal"

  - trigger: homeassistant
    event: start
    id: "arranque"

# Las condiciones se evalúan antes de reiniciar: un disparo descartado no cancela lo que esté en curso.
conditions:
  # El movimiento solo dispara estando LIBRE y con la puerta cerrada (entrada sin evento de puerta).
  # Con la puerta abierta manda la puerta; en los demás estados lo vigila el scan o se ignora.
  - condition: template
    value_template: >-
      {{ trigger.id != 'movimiento' or (is_state(status_entity_top, 'LIBRE') and is_state(door_entity, 'off')) }}
  # Protección: solo estando OCUPADO, con todos los sensores apagados y si está activada
  - condition: template
    value_template: >-
      {%- if trigger.id == 'ocupado_sin_movimiento' -%}
        {%- set lista = [motion_sensors_list] if motion_sensors_list is string else motion_sensors_list -%}
        {{ max_sin_movimiento | int(0) > 0 and is_state(status_entity_top, 'OCUPADO')
           and lista | select('is_state', 'on') | list | count == 0 }}
      {%- else -%}
        true
      {%- endif -%}
  # Manipulación: solo durante el SCAN, sin estados inválidos, y si no la hizo una automatización o un
  # script (su cambio lleva el contexto de esa ejecución). Se ignoran las confirmaciones tardías de
  # los propios comandos: 10 s después de un disparo para interruptores; para termostatos, 45 s después
  # de un disparo, 75 s después de que el aire se encendió, o si la nueva temperatura es la de ocupación.
  - condition: template
    value_template: >-
      {%- if trigger.id == 'manipulacion' -%}
        {%- set invalidos = ['unavailable', 'unknown'] -%}
        {%- set ctx = trigger.to_state.context.id if trigger.to_state is not none else '' -%}
        {%- set es_clima = trigger.entity_id.startswith('climate.') -%}
        {%- set desde_disparo = (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered, 0))
              if this is defined else 999 -%}
        {%- set eco_clima = false -%}
        {%- if es_clima and trigger.to_state is not none and trigger.from_state is not none
              and trigger.to_state.state == trigger.from_state.state -%}
          {%- set desde_encendido = as_timestamp(now()) - as_timestamp(trigger.to_state.last_changed, 0) -%}
          {%- set nueva = trigger.to_state.attributes.temperature | float(-100) -%}
          {%- set eco_clima = desde_encendido < 75 or (nueva - temp_objetivo | float(0)) | abs <= 0.6 -%}
        {%- endif -%}
        {{ is_state(status_entity_top, 'SCAN')
           and trigger.from_state is not none and trigger.to_state is not none
           and trigger.from_state.state not in invalidos and trigger.to_state.state not in invalidos
           and states.automation | selectattr('context.id', 'eq', ctx) | list | count == 0
           and states.script | selectattr('context.id', 'eq', ctx) | list | count == 0
           and desde_disparo > (45 if es_clima else 10)
           and not eco_clima }}
      {%- else -%}
        true
      {%- endif -%}
  # "libre_manual" cuando lo elige una persona o una escena, no esta misma automatización
  # (el cambio que hace ella lleva el contexto de su última ejecución)
  - condition: template
    value_template: >-
      {{ trigger.id != 'libre_manual' or this is not defined or this.context is not defined
         or trigger.to_state.context.id != this.context.id }}
  # Con calendario de horas operativas, las horas fijas no cuentan
  - condition: template
    value_template: >-
      {{ trigger.id not in ['inicio', 'fin'] or calendario in ['', none] }}
  # El inicio de jornada solo en días hábiles
  - condition: template
    value_template: >-
      {{ trigger.id not in ['inicio', 'inicio_cal'] or workday_entity in ['', none] or is_state(workday_entity, 'on') }}

actions:
  - variables:
      climate_list: !input target_climates
      lights_list: !input target_lights
      extra_list: !input extra_off
      contactors_list: !input ac_contactors
      modo_auto: !input modo_auto
      status_entity: !input classroom_status
      countdown_entity: !input countdown_indicator
      previous_status_entity: !input previous_status_display
      scanning_time: !input off_delay
      door_time: !input door_off_delay
      modo_libre: !input modo_libre
      previous_status: "{{ states(status_entity) }}"
      puerta_abierta: "{{ is_state(door_entity, 'on') }}"
      hay_clima: "{{ (climate_list.entity_id | default([])) | count > 0 }}"
      hay_luces: "{{ (lights_list.entity_id | default([])) | count > 0 }}"
      hay_extra: "{{ (extra_list.entity_id | default([])) | count > 0 }}"
      hay_contactor: "{{ (contactors_list.entity_id | default([])) | count > 0 }}"
      hay_cuenta: "{{ countdown_entity != '' and countdown_entity is not none }}"
      hay_anterior: "{{ previous_status_entity != '' and previous_status_entity is not none }}"
      hay_movimiento: >-
        {%- set lista = [motion_sensors_list] if motion_sensors_list is string else motion_sensors_list -%}
        {{ lista | select('is_state', 'on') | list | count > 0 }}
      # Algún equipo del salón encendido (aire, contactor, luces o cargas extra)
      equipo_encendido: >-
        {%- set ns = namespace(ids=[]) -%}
        {%- for g in [climate_list, contactors_list, lights_list, extra_list] -%}
          {%- set i = g.entity_id | default([]) if g is mapping else [] -%}
          {%- set ns.ids = ns.ids + ([i] if i is string else i) -%}
        {%- endfor -%}
        {{ ns.ids | reject('is_state', ['off', 'unavailable', 'unknown']) | list | count > 0 }}

  - choose:
      # ── Una persona o una escena eligió LIBRE: apagar todo ──
      - conditions:
          - condition: trigger
            id: "libre_manual"
        sequence:
          - if:
              - condition: template
                value_template: "{{ hay_cuenta }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ countdown_entity }}"
                data:
                  value: 0
          - &apagar_todo
            alias: "Apagar aire, luces y cargas extra"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ hay_clima }}"
                then:
                  - action: climate.set_hvac_mode
                    continue_on_error: true
                    target: !input target_climates
                    data:
                      hvac_mode: "off"
              - if:
                  - condition: template
                    value_template: "{{ hay_contactor }}"
                then:
                  - action: switch.turn_off
                    continue_on_error: true
                    target: !input ac_contactors
              - if:
                  - condition: template
                    value_template: "{{ hay_luces }}"
                then:
                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target: !input target_lights
              - if:
                  - condition: template
                    value_template: "{{ hay_extra }}"
                then:
                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target: !input extra_off

      # ── Se abre la puerta: encender si es una entrada; si queda abierta, apagar aire y luego luces ──
      - conditions:
          - condition: trigger
            id: "puerta_abre"
        sequence:
          # Entrada: solo si venía de LIBRE. Si el aire lo apagó la puerta abierta, vuelve únicamente
          # cuando se confirma que hay gente (scan o manipulación), no con la siguiente apertura.
          - if:
              - condition: template
                value_template: "{{ is_state(modo_auto, 'on') and previous_status == 'LIBRE' }}"
            then:
              - &encender
                alias: "Encender: aire, 1 s después la temperatura, y luego las luces"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ hay_clima }}"
                    then:
                      - action: climate.set_hvac_mode
                        continue_on_error: true
                        target: !input target_climates
                        data:
                          hvac_mode: "cool"
                  - if:
                      - condition: template
                        value_template: "{{ hay_contactor }}"
                    then:
                      - action: switch.turn_on
                        continue_on_error: true
                        target: !input ac_contactors
                  # El modo y la temperatura van en pasos separados: varios termostatos Z-Wave
                  # ignoran la temperatura si llega junto con el cambio de modo. La temperatura va
                  # antes que las luces para que una puerta que se cierra rápido no la cancele.
                  - if:
                      - condition: template
                        value_template: "{{ hay_clima }}"
                    then:
                      - delay:
                          seconds: 1
                      - action: climate.set_temperature
                        continue_on_error: true
                        target: !input target_climates
                        data:
                          temperature: !input target_temperature
                  - if:
                      - condition: template
                        value_template: "{{ hay_luces }}"
                    then:
                      - action: homeassistant.turn_on
                        continue_on_error: true
                        target: !input target_lights
          - &puerta_abierta
            alias: "Puerta abierta: tras el tiempo, apagar aire y luego luces (sin mirar movimiento)"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ hay_anterior and previous_status != 'PUERTA_ABIERTA' }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ previous_status_entity }}"
                    data:
                      value: "{{ previous_status }}"
              - action: input_select.select_option
                target:
                  entity_id: !input classroom_status
                data:
                  option: "PUERTA_ABIERTA"
              # Cuenta en tramos de 10 s; si cierran la puerta, el restart la cancela
              - repeat:
                  count: "{{ (door_time / 10) | int }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ hay_cuenta }}"
                      then:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ countdown_entity }}"
                          data:
                            value: "{{ door_time - (repeat.index - 1) * 10 }}"
                    - &confirmar_temp
                      alias: "Confirmar la temperatura: reenviarla entre 20 y 40 s después de encender el aire si el termostato no la tomó"
                      repeat:
                        for_each: >-
                          {%- set ids = climate_list.entity_id | default([]) -%}
                          {%- set ns = namespace(r=[]) -%}
                          {%- for e in ([ids] if ids is string else ids) -%}
                            {%- set s = states[e] -%}
                            {%- if s is not none and s.state == 'cool' -%}
                              {%- set edad = as_timestamp(now()) - as_timestamp(s.last_changed) -%}
                              {%- if 20 <= edad < 40
                                    and (s.attributes.temperature | float(-100) - temp_objetivo | float(0)) | abs > 0.6 -%}
                                {%- set ns.r = ns.r + [e] -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.r }}
                        sequence:
                          - action: climate.set_temperature
                            continue_on_error: true
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              temperature: !input target_temperature
                    - delay:
                        seconds: 10
              - if:
                  - condition: template
                    value_template: "{{ hay_cuenta }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ countdown_entity }}"
                    data:
                      value: 0
              - if:
                  - condition: template
                    value_template: "{{ hay_clima }}"
                then:
                  - action: climate.set_hvac_mode
                    continue_on_error: true
                    target: !input target_climates
                    data:
                      hvac_mode: "off"
              - if:
                  - condition: template
                    value_template: "{{ hay_contactor }}"
                then:
                  - action: switch.turn_off
                    continue_on_error: true
                    target: !input ac_contactors
              - if:
                  - condition: template
                    value_template: "{{ hay_luces or hay_extra }}"
                then:
                  - delay:
                      seconds: !input delay_off_device
                  - if:
                      - condition: template
                        value_template: "{{ hay_luces }}"
                    then:
                      - action: homeassistant.turn_off
                        continue_on_error: true
                        target: !input target_lights
                  - if:
                      - condition: template
                        value_template: "{{ hay_extra }}"
                    then:
                      - action: homeassistant.turn_off
                        continue_on_error: true
                        target: !input extra_off
              # Sigue en PUERTA_ABIERTA hasta que cierren la puerta

      # ── Se cierra la puerta (o movimiento estando libre): SCAN para confirmar ocupación ──
      - conditions:
          - condition: trigger
            id:
              - "puerta_cierra"
              - "movimiento"
        sequence:
          - &scan
            alias: "SCAN: confirmar si hay gente"
            sequence:
              # Movimiento sin evento de puerta (la puerta no registró la entrada): encender en automático
              - if:
                  - condition: trigger
                    id: "movimiento"
                  - condition: template
                    value_template: "{{ is_state(modo_auto, 'on') }}"
                then:
                  - *encender
              - if:
                  - condition: template
                    value_template: "{{ hay_anterior }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ previous_status_entity }}"
                    data:
                      value: "{{ previous_status }}"
              - action: input_select.select_option
                target:
                  entity_id: !input classroom_status
                data:
                  option: "SCAN"
              # Una nueva detección durante el scan confirma de inmediato
              - repeat:
                  count: "{{ (scanning_time / 10) | int }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ hay_cuenta }}"
                      then:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ countdown_entity }}"
                          data:
                            value: "{{ scanning_time - (repeat.index - 1) * 10 }}"
                    - *confirmar_temp
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: !input motion_sensors
                          to: "on"
                      timeout:
                        seconds: 10
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      then:
                        - &ocupado
                          alias: "Hay gente: OCUPADO (reanuda el aire si la puerta lo había apagado)"
                          sequence:
                            - if:
                                - condition: template
                                  value_template: "{{ hay_cuenta }}"
                              then:
                                - action: input_number.set_value
                                  target:
                                    entity_id: "{{ countdown_entity }}"
                                  data:
                                    value: 0
                            - if:
                                - condition: template
                                  value_template: >-
                                    {%- set c = climate_list.entity_id | default([]) -%}
                                    {%- set k = contactors_list.entity_id | default([]) -%}
                                    {%- set aire = ([c] if c is string else c) + ([k] if k is string else k) -%}
                                    {%- set l = lights_list.entity_id | default([]) -%}
                                    {%- set equipo = aire if aire | count > 0 else ([l] if l is string else l) -%}
                                    {{ is_state(modo_auto, 'on') and equipo | count > 0
                                       and equipo | reject('is_state', 'off') | list | count == 0 }}
                              then:
                                - *encender
                            - action: input_select.select_option
                              target:
                                entity_id: !input classroom_status
                              data:
                                option: "OCUPADO"
                            - &esperar_confirmar
                              alias: "Si el aire se acaba de encender, esperar a los 20 s y confirmar la temperatura"
                              sequence:
                                - variables:
                                    espera_confirmar: >-
                                      {%- set ids = climate_list.entity_id | default([]) -%}
                                      {%- set ns = namespace(m=999) -%}
                                      {%- for e in ([ids] if ids is string else ids) -%}
                                        {%- set s = states[e] -%}
                                        {%- if s is not none and s.state == 'cool' -%}
                                          {%- set ns.m = [ns.m, as_timestamp(now()) - as_timestamp(s.last_changed)] | min -%}
                                        {%- endif -%}
                                      {%- endfor -%}
                                      {{ (21 - ns.m) | round(0) | int if ns.m < 20 else 0 }}
                                - if:
                                    - condition: template
                                      value_template: "{{ espera_confirmar | int(0) > 0 }}"
                                  then:
                                    - delay:
                                        seconds: "{{ espera_confirmar | int(0) }}"
                                    - *confirmar_temp
                        - stop: "Ocupación confirmada"
              # Sin una nueva detección: hay gente solo si el sensor sigue encendido (se quedó activo todo el scan)
              - if:
                  - condition: template
                    value_template: >-
                      {%- set lista = [motion_sensors_list] if motion_sensors_list is string else motion_sensors_list -%}
                      {{ lista | select('is_state', 'on') | list | count > 0 }}
                then:
                  - *ocupado
                else:
                  - &vaciar
                    alias: "Espacio vacío: apagar o subir el aire, quedar LIBRE y luego apagar luces"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ is_state(modo_auto, 'on') and modo_libre == 'subir' }}"
                        then:
                          # Subir solo los termostatos encendidos; un contactor no regula temperatura: se apaga
                          - if:
                              - condition: template
                                value_template: "{{ hay_clima }}"
                            then:
                              - repeat:
                                  for_each: >-
                                    {%- set ids = climate_list.entity_id -%}
                                    {{ ([ids] if ids is string else ids) | reject('is_state', 'off') | list }}
                                  sequence:
                                    - action: climate.set_temperature
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        temperature: !input temp_empty
                        else:
                          - if:
                              - condition: template
                                value_template: "{{ hay_clima }}"
                            then:
                              - action: climate.set_hvac_mode
                                continue_on_error: true
                                target: !input target_climates
                                data:
                                  hvac_mode: "off"
                      - if:
                          - condition: template
                            value_template: "{{ hay_contactor }}"
                        then:
                          - action: switch.turn_off
                            continue_on_error: true
                            target: !input ac_contactors
                      # LIBRE antes de la espera: si abren la puerta mientras las luces siguen
                      # encendidas, es una entrada desde LIBRE y se vuelve a encender todo
                      - &quedar_libre
                        alias: "Cuenta a cero y estado LIBRE"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ hay_cuenta }}"
                            then:
                              - action: input_number.set_value
                                target:
                                  entity_id: "{{ countdown_entity }}"
                                data:
                                  value: 0
                          - if:
                              - condition: template
                                value_template: "{{ hay_anterior }}"
                            then:
                              - action: input_text.set_value
                                target:
                                  entity_id: "{{ previous_status_entity }}"
                                data:
                                  value: "{{ previous_status }}"
                          # Vuelve a disparar la automatización, pero "libre_manual" lo descarta (es ella misma)
                          - action: input_select.select_option
                            target:
                              entity_id: !input classroom_status
                            data:
                              option: "LIBRE"
                      - if:
                          - condition: template
                            value_template: "{{ hay_luces or hay_extra }}"
                        then:
                          - delay:
                              seconds: !input delay_off_device
                          - if:
                              - condition: template
                                value_template: "{{ hay_luces }}"
                            then:
                              - action: homeassistant.turn_off
                                continue_on_error: true
                                target: !input target_lights
                          - if:
                              - condition: template
                                value_template: "{{ hay_extra }}"
                            then:
                              - action: homeassistant.turn_off
                                continue_on_error: true
                                target: !input extra_off

      # ── Alguien manipula un interruptor o el termostato durante el SCAN: hay gente ──
      - conditions:
          - condition: trigger
            id: "manipulacion"
        sequence:
          - if:
              - condition: template
                value_template: "{{ hay_cuenta }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ countdown_entity }}"
                data:
                  value: 0
          - if:
              - condition: template
                value_template: "{{ hay_anterior }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: "{{ previous_status_entity }}"
                data:
                  value: "{{ previous_status }}"
          - action: input_select.select_option
            target:
              entity_id: !input classroom_status
            data:
              option: "OCUPADO"

      # ── Protección: OCUPADO sin movimiento durante el tiempo máximo ──
      - conditions:
          - condition: trigger
            id: "ocupado_sin_movimiento"
        sequence:
          - *vaciar

      # ── Fin de jornada: pasa a manual; si no está OCUPADO, apaga lo que quede ──
      - conditions:
          - condition: trigger
            id:
              - "fin"
              - "fin_cal"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input modo_auto
          - choose:
              # Interrumpió un scan: se repite (ya en manual, no enciende nada)
              - conditions:
                  - condition: template
                    value_template: "{{ previous_status == 'SCAN' }}"
                sequence:
                  - *scan
              - conditions:
                  - condition: template
                    value_template: "{{ previous_status != 'OCUPADO' }}"
                sequence:
                  - *apagar_todo
                  - *quedar_libre

      # ── Inicio de jornada: pasa a automático; si hay gente con la puerta cerrada, enciende ──
      - conditions:
          - condition: trigger
            id:
              - "inicio"
              - "inicio_cal"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input modo_auto
          - choose:
              # Puerta abierta: no enciende; corre (o reinicia) la cuenta de puerta abierta
              - conditions:
                  - condition: template
                    value_template: "{{ puerta_abierta and previous_status != 'LIBRE' }}"
                sequence:
                  - *puerta_abierta
              - conditions:
                  - condition: template
                    value_template: "{{ not puerta_abierta and (hay_movimiento or previous_status == 'OCUPADO') }}"
                sequence:
                  - *encender
                  - action: input_select.select_option
                    target:
                      entity_id: !input classroom_status
                    data:
                      option: "OCUPADO"
                  - *esperar_confirmar
              # Interrumpió un scan: se repite
              - conditions:
                  - condition: template
                    value_template: "{{ previous_status == 'SCAN' }}"
                sequence:
                  - *scan

      # ── Reinicio de Home Assistant: reevaluar el salón (el estado guardado puede estar desactualizado
      #    si el equipo se apagó de golpe) ──
      - conditions:
          - condition: trigger
            id: "arranque"
        sequence:
          # Con calendario: si HA estuvo apagado al empezar o terminar un evento, alinear el modo
          - if:
              - condition: template
                value_template: "{{ calendario not in ['', none] }}"
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state(calendario, 'on')
                         and (workday_entity in ['', none] or is_state(workday_entity, 'on')) }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input modo_auto
                else:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input modo_auto
          - choose:
              # Puerta abierta: corre la cuenta de puerta abierta (apaga si sigue abierta)
              - conditions:
                  - condition: template
                    value_template: "{{ puerta_abierta }}"
                sequence:
                  - *puerta_abierta
              # Puerta cerrada con movimiento o equipos encendidos, o a medio confirmar: SCAN
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ hay_movimiento or equipo_encendido
                         or previous_status in ['SCAN', 'PUERTA_ABIERTA', 'OCUPADO'] }}
                sequence:
                  - *scan
            # Puerta cerrada, sin movimiento y todo apagado: LIBRE
            default:
              - if:
                  - condition: template
                    value_template: "{{ previous_status != 'LIBRE' }}"
                then:
                  - *quedar_libre
